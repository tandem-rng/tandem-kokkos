# Development environments, with clang as the primary compiler. The default one takes Kokkos
# 5.2.1 (Serial and OpenMP, the newest conda-forge build) and clang. The `gcc` one is the same
# with GCC, as a compatibility check. The `cuda` one has a CUDA 12.8 toolchain, the newest the
# GPU host's 570 driver runs, with clang as the nvcc host compiler, and builds Kokkos 5.2.2
# with the CUDA backend from source, because the conda-forge package has none.
[workspace]
name = "tandem-kokkos"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
cmake = ">=3.25"
ninja = "*"
python = ">=3.11"

[feature.host.dependencies]
kokkos = "5.2.1.*"
clangxx = "*"

[feature.host.target.linux-64.dependencies]
llvm-openmp = "*"

[feature.host.target.osx-arm64.dependencies]
llvm-openmp = "*"

[feature.host.tasks]
configure = "cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release -DTANDEM_BENCH=ON -DCMAKE_CXX_COMPILER=clang++"
build = { cmd = "cmake --build build/host", depends-on = ["configure"] }
test = { cmd = "ctest --test-dir build/host --output-on-failure", depends-on = ["build"] }

[feature.gcc]
platforms = ["linux-64"]

[feature.gcc.dependencies]
gxx = "14.*"

[feature.gcc.tasks]
configure-gcc = "cmake -S . -B build/gcc -G Ninja -DCMAKE_BUILD_TYPE=Release -DTANDEM_BENCH=ON -DCMAKE_CXX_COMPILER=g++"
build-gcc = { cmd = "cmake --build build/gcc", depends-on = ["configure-gcc"] }
test-gcc = { cmd = "ctest --test-dir build/gcc --output-on-failure", depends-on = ["build-gcc"] }

[feature.cuda]
platforms = ["linux-64"]

[feature.cuda.dependencies]
cuda-version = "12.8.*"
cuda-nvcc = "12.8.*"
cuda-cudart-dev = "12.8.*"
clangxx = "19.*"
gxx = "14.*"
git = "*"

[feature.cuda.tasks]
kokkos = "bash tools/build_kokkos_cuda.sh"
configure-cuda = "NVCC_WRAPPER_DEFAULT_COMPILER=clang++ cmake -S . -B build/cuda -G Ninja -DCMAKE_BUILD_TYPE=Release -DTANDEM_BENCH=ON -DKokkos_ROOT=build/kokkos-cuda/install -DCMAKE_CXX_COMPILER=$PIXI_PROJECT_ROOT/build/kokkos-cuda/install/bin/nvcc_wrapper"
build-cuda = { cmd = "NVCC_WRAPPER_DEFAULT_COMPILER=clang++ cmake --build build/cuda", depends-on = ["configure-cuda"] }
test-cuda = { cmd = "ctest --test-dir build/cuda --output-on-failure", depends-on = ["build-cuda"] }

[environments]
default = ["host"]
gcc = { features = ["host", "gcc"] }
cuda = { features = ["cuda"] }
