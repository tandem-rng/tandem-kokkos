name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Kokkos 5.2.1 from conda-forge has the Serial and OpenMP backends, and the test binary runs
# every check on both. Clang is the primary compiler, one job builds with GCC 14. GitHub runners have no GPU: run the CUDA tests on a GPU host with the
# pixi `cuda` environment.
jobs:
  test:
    name: ${{ matrix.os }}, ${{ matrix.cxx }}${{ matrix.flags && ' (TANDEM_NO_SIMD)' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: clang++
            env: default
          - os: macos-latest
            cxx: clang++
            env: default
          - os: ubuntu-latest
            cxx: g++
            env: gcc
          - os: ubuntu-latest
            cxx: clang++
            env: default
            flags: -DTANDEM_NO_SIMD
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          environments: ${{ matrix.env }}
          locked: false
      - run: >
          pixi run -e ${{ matrix.env }} cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DTANDEM_BENCH=ON -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror ${{ matrix.flags }}"
      - run: pixi run -e ${{ matrix.env }} cmake --build build
      - run: pixi run -e ${{ matrix.env }} ctest --test-dir build --output-on-failure
        env:
          OMP_NUM_THREADS: 4
  vectors:
    name: vector header and conformance copies are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          git clone -q https://github.com/tandem-rng/spec ../tandem-spec
          python3 tools/gen_vectors.py ../tandem-spec/vectors.json > tests/vectors.hpp
          git diff --exit-code tests/vectors.hpp
      # The copies of the conformance files equal the spec's at the pinned commit, file for file.
      - run: |
          pin=2a4bd08205596bc12bb7ae102862c97a0477dc2e
          diff <(git -C ../tandem-spec ls-tree --name-only $pin conformance/ | grep '\.json$') \
               <(ls tests/conformance/*.json | sed 's|^tests/||')
          for f in tests/conformance/*.json; do
            git -C ../tandem-spec show "$pin:${f#tests/}" | cmp - "$f"
          done
  pin:
    name: tandem-cuda pin is on its main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          pin=$(git rev-parse HEAD:external/tandem-cuda)
          git clone -q --branch main https://github.com/tandem-rng/tandem-cuda ../tandem-cuda
          git -C ../tandem-cuda merge-base --is-ancestor "$pin" main
