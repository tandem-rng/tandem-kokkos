name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Kokkos 5.2.1 from conda-forge has the Serial and OpenMP backends, and the test binary runs
# every check on both. GitHub runners have no GPU: run the CUDA tests on a GPU host with the
# pixi `cuda` environment.
jobs:
  test:
    name: ${{ matrix.os }}${{ matrix.flags && ' (TANDEM_NO_SIMD)' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: ubuntu-latest
            flags: -DTANDEM_NO_SIMD
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          environments: default
          locked: false
      - run: >
          pixi run cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTANDEM_BENCH=ON
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror ${{ matrix.flags }}"
      - run: pixi run cmake --build build
      - run: pixi run ctest --test-dir build --output-on-failure
        env:
          OMP_NUM_THREADS: 4
  vectors:
    name: vector header is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          git clone --depth 1 https://github.com/tandem-rng/spec ../tandem-spec
          python3 tools/gen_vectors.py ../tandem-spec/vectors.json > tests/vectors.hpp
          git diff --exit-code tests/vectors.hpp
